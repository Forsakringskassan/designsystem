name: PR Changelog

on:
    pull_request:
        branches:
            - main
            - "releases/**"

permissions:
    pull-requests: write

jobs:
    pr-changelog:
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: "${{ github.head_ref }}"
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22.x
            - name: Install dependencies
              run: |
                  npm ci
                  npm install --no-save \
                      @forsakringskassan/semantic-release-common@3 \
                      conventional-changelog-conventionalcommits@8
            - name: Pull Requst Changelog
              uses: ext/pull-request-changelog@94f2a58932d3699c19f6c7756e1a06f98aefc670 # v1
              with:
                  config: .github/pull-request-changelog/config.mjs
                  template-dir: .github/pull-request-changelog
