name: Lint

on: [push, pull_request]

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js 22.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22.x
            - name: Install dependencies
              run: npm ci
            - name: Minimal build
              run: npm exec lerna -- run --include-dependencies --scope=@fkui/theme-default --scope=@fkui/vue --scope=@fkui/vue-labs --scope=@fkui/cypress-split build
            - name: Prettier
              uses: Forsakringskassan/prettier-config@fb9e06ca761ec48880a2ca39c7cbe2d352ef2ff2 # v3.7.15
            - name: ESLint
              if: success() || failure()
              uses: Forsakringskassan/eslint-config@617eb9fcbfc96f7c80225d2a0d0a831b86cc85d2 # v15.13.17
            - name: HTML Validate
              if: success() || failure()
              run: npm run html-validate -- --max-warnings 0 || false
            - name: Stylelint
              if: success() || failure()
              run: npm run stylelint -- --max-warnings 0
            - name: Markdownlint
              if: success() || failure()
              run: npm run markdownlint
            - name: pnr-scanner
              if: success() || failure()
              run: |
                  errors=$(npx pnr-scanner . 2> /dev/null | egrep "    " | wc -l)
                  if [[ "${errors}" != "0" ]]; then
                      echo "Found ${errors} potential personnummer. Rerun `npx pnr-scanner .` locally for more information."
                      exit 1
                  fi
    npm-pkg-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js 22.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 22.x
            - name: Install Dependencies
              run: npm ci
            - name: Build
              run: |
                  npm run build
                  npm run build:docs
            - name: npm-pkg-lint
              uses: ext/npm-pkg-lint@4a56802561878ebeaa5d8f254b103e936a720fff # v5.4.2
              with:
                  build: false
                  folders: packages/* docs
                  allow-files: dist/**/examples/**
                  allow-dependencies: fk-icons
