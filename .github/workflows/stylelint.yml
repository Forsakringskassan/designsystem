name: Stylelint compatibility

on: [push]

permissions:
    contents: read

jobs:
    stylelint:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                stylelint-version: [16.x, 17.x, 18.x]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  cache: npm
                  node-version: 24.x
            - name: Install dependencies
              run: npm ci
            - name: Downgrade stylelint-config
              if: ${{ matrix.stylelint-version != '18.x' }}
              run: |
                  if [[ "${{ matrix.stylelint-version }}" = "16.x" ]]; then
                      npm install @forsakringskassan/stylelint-config@3.2.3
                  elif [[ "${{ matrix.stylelint-version }}" = "17.x" ]]; then
                      npm install @forsakringskassan/stylelint-config@3.5.2
                  fi
                  npx stylelint --version
            - name: Build (minimal)
              run: npm exec lerna -- run build --include-dependencies --scope=@fkui/design
            - name: Stylelint
              run: npx stylelint packages/design/src/fkui.scss
