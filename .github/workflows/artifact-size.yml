name: Artifact size

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

jobs:
    analyze-base:
        name: Analyze (base)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout target branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.base.ref }}
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22.x
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Workaround # https://github.com/ext/artifact-size-analyzer/issues/88
              run: mkdir -p temp
            - name: Run analyzer
              uses: ext/artifact-size-analyzer/analyze@25dd249eacbef70fcab39789685371e1c64176db # v1.2.6
              with:
                  config-file: .github/artifact-size.json
                  artifact-name: base-size

    analyze-current:
        name: Analyze (current)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout head ref
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22.x
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Workaround # https://github.com/ext/artifact-size-analyzer/issues/88
              run: mkdir -p temp
            - name: Run analyzer (current)
              uses: ext/artifact-size-analyzer/analyze@25dd249eacbef70fcab39789685371e1c64176db # v1.2.6
              with:
                  config-file: .github/artifact-size.json
                  artifact-name: current-size

    compare:
        name: Compare
        permissions:
            contents: read
            pull-requests: write
        runs-on: ubuntu-latest
        needs: [analyze-base, analyze-current]
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: 22.x
            - name: Install dependencies
              run: npm ci
            - name: Compare results
              id: compare
              uses: ext/artifact-size-analyzer/compare@25dd249eacbef70fcab39789685371e1c64176db # v1.2.6
              with:
                  base-artifact: base-size
                  current-artifact: current-size
            - name: Post sticky PR comment
              uses: marocchino/sticky-pull-request-comment@v3
              with:
                  header: artifact-size-analyzer
                  message: |
                      ${{ steps.compare.outputs.markdown }}
