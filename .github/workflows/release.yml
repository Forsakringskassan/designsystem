name: Release
concurrency: release-${{ github.ref }}

on:
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: Release
        uses: Forsakringskassan/.github/.github/workflows/npm-release.yaml@733eb3236b35a491f1fd35c291dd3057d510d743 # main
        with:
            app-id: ${{ vars.RELEASE_APP_ID }}
            config-preset: "@forsakringskassan/semantic-release-monorepo-config"
            build-command: |
                npm run build
                npm run build:docs
        secrets:
            app-key: ${{ secrets.RELEASE_APP_KEY }}

    deploy-documentation:
        needs: [release]
        name: Deploy new documentation
        uses: ./.github/workflows/docs.yml
